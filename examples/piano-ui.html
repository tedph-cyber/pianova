<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6faf8">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="spike.css">
<title>pianova · stage piano</title>
<style>
  .stage { flex: 1 1 auto; min-height: 140px; display: flex; gap: 8px; }
  .stage .piano { min-width: 0; }
  .wheels { display: flex; gap: 6px; flex: 0 0 auto; }
  .wheel { width: 54px; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; gap: 4px; font-size: 12px; color: var(--muted); user-select: none; -webkit-user-select: none; }
  .wheel b { font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px; }
  .wheel-track { position: relative; width: 100%; min-height: 80px; border-radius: 12px; background: var(--ink); touch-action: none; cursor: grab; }
  .wheel-track::before { content: ''; position: absolute; left: 50%; top: 10px; bottom: 10px; width: 4px; margin-left: -2px; border-radius: 2px; background: oklch(0.4 0.03 165); }
  .wheel-thumb { position: absolute; left: 6px; right: 6px; height: 22px; margin-top: -11px; border-radius: 8px; background: var(--surface); box-shadow: 0 1px 3px oklch(0 0 0 / 0.4), inset 0 -4px 0 var(--accent); pointer-events: none; }
  .wheel-value { font-variant-numeric: tabular-nums; min-height: 1.2em; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper .val { min-width: 3ch; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <span class="brand">pianova</span>
    <div class="seg" role="group" aria-label="Sound">
      <button type="button" data-wave="sine">Sine</button>
      <button type="button" data-wave="triangle">Tri</button>
      <button type="button" data-wave="square">Square</button>
      <button type="button" data-wave="sawtooth">Saw</button>
    </div>
    <button type="button" class="pill" id="sustain" aria-pressed="false">Sustain</button>
    <span class="spacer"></span>
    <div class="steps" role="group" aria-label="Move the keyboard">
      <button type="button" class="step" id="oct-down" aria-label="Lower notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>low</span></button>
      <button type="button" class="step" id="oct-up" aria-label="Higher notes"><span>high</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <button type="button" class="pill" id="tune-btn" aria-expanded="false" aria-controls="tune">Tune</button>
  </header>

  <section class="readout" id="readout" data-state="hint" aria-live="polite">
    <div class="main" id="r-main">Tap any key</div>
    <div class="feel" id="r-feel"></div>
    <div class="notes" id="r-notes"></div>
  </section>

  <div class="stage">
    <div class="wheels">
      <div class="wheel"><b>Pitch</b><div class="wheel-track" id="pb" role="slider" aria-label="Pitch bend" aria-valuemin="-2" aria-valuemax="2" aria-valuenow="0"><div class="wheel-thumb"></div></div><span class="wheel-value" id="pb-out">0.00</span></div>
      <div class="wheel"><b>Mod</b><div class="wheel-track" id="mod" role="slider" aria-label="Modulation" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="wheel-thumb"></div></div><span class="wheel-value" id="mod-out">0%</span></div>
    </div>
    <div class="piano" id="piano"></div>
  </div>
</div>

<aside class="panel" id="tune" hidden aria-label="Tuning">
  <div class="panel-head">
    <strong>Tune</strong>
    <button type="button" class="icon" id="tune-close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="field"><span>Transpose (semitones)</span>
    <div class="stepper"><button type="button" class="icon" id="trans-down" aria-label="Transpose down">−</button><span class="val" id="trans-val">0</span><button type="button" class="icon" id="trans-up" aria-label="Transpose up">+</button></div></div>
  <div class="field"><span>Octave shift (sound)</span>
    <div class="stepper"><button type="button" class="icon" id="osh-down" aria-label="Octave down">−</button><span class="val" id="osh-val">0</span><button type="button" class="icon" id="osh-up" aria-label="Octave up">+</button></div></div>
  <div class="field"><span>Detune (cents)</span>
    <div class="stepper"><button type="button" class="icon" id="det-down" aria-label="Detune down">−</button><span class="val" id="det-val">0</span><button type="button" class="icon" id="det-up" aria-label="Detune up">+</button></div></div>
</aside>

<script type="module">
  import { Piano } from '../dist/pianova.mjs';
  import { mountOverlays, wireSteps, pop } from './spike-ui.js';

  const $ = (id) => document.getElementById(id);
  mountOverlays({ title: 'Stage piano', text: 'Wheels on the left, keys everywhere else.' });

  const piano = new Piano({ root: '#piano', fit: { start: 'C3', minWhiteKeyPx: 50 } });
  wireSteps(piano);

  // ---- readout ----
  const sign = (n) => (n === 0 ? '±0' : n > 0 ? '+' + n : String(n));
  function summary() {
    $('r-notes').textContent = 'transpose ' + sign(piano.transpose) + ' · octave ' + sign(piano.octaveShift) + ' · detune ' + piano.detune + '¢';
  }
  piano.on('noteOn', (n) => {
    $('readout').dataset.state = 'note';
    $('r-main').textContent = n.name;
    $('r-feel').textContent = 'MIDI ' + n.midi;
    pop($('r-main'));
  });
  summary();

  // ---- sound ----
  const waves = document.querySelectorAll('[data-wave]');
  const setWave = (w) => {
    piano.setWaveform(w);
    for (const b of waves) b.setAttribute('aria-pressed', b.dataset.wave === w);
  };
  for (const b of waves) b.onclick = () => setWave(b.dataset.wave);
  setWave('sine');

  $('sustain').onclick = () => {
    piano.sustain = !piano.sustain;
    $('sustain').setAttribute('aria-pressed', piano.sustain);
  };

  // ---- wheels (pointer events, so touch works) ----
  // frac: 0 = bottom, 1 = top.
  function wheel(track, { initial, spring, onChange }) {
    const thumb = track.firstElementChild;
    let pointer = null;
    const show = (frac) => { thumb.style.top = (1 - frac) * 100 + '%'; };
    const set = (frac) => { show(frac); onChange(frac); };
    const fromEvent = (e) => {
      const r = track.getBoundingClientRect();
      return Math.max(0, Math.min(1, 1 - (e.clientY - r.top) / r.height));
    };
    track.addEventListener('pointerdown', (e) => {
      pointer = e.pointerId;
      track.setPointerCapture?.(e.pointerId);
      e.preventDefault();
      set(fromEvent(e));
    });
    track.addEventListener('pointermove', (e) => { if (e.pointerId === pointer) set(fromEvent(e)); });
    const end = (e) => {
      if (e.pointerId !== pointer) return;
      pointer = null;
      if (spring) set(initial);
    };
    for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) track.addEventListener(t, end);
    set(initial);
  }

  wheel($('pb'), {
    initial: 0.5, spring: true,
    onChange: (f) => {
      const st = (f - 0.5) * 4; // −2 … +2 semitones
      piano.pitchBend(st);
      $('pb-out').textContent = st.toFixed(2);
      $('pb').setAttribute('aria-valuenow', st.toFixed(2));
    },
  });
  wheel($('mod'), {
    initial: 0, spring: false,
    onChange: (f) => {
      piano.modulation(f);
      $('mod-out').textContent = Math.round(f * 100) + '%';
      $('mod').setAttribute('aria-valuenow', Math.round(f * 100));
    },
  });

  // ---- tune panel ----
  function stepper(prefix, get, set, step) {
    const out = $(prefix + '-val');
    const sync = () => { out.textContent = get(); summary(); };
    $(prefix + '-down').onclick = () => { set(get() - step); sync(); };
    $(prefix + '-up').onclick = () => { set(get() + step); sync(); };
    sync();
  }
  stepper('trans', () => piano.transpose, (v) => { piano.transpose = v; }, 1);
  stepper('osh', () => piano.octaveShift, (v) => { piano.octaveShift = v; }, 1);
  stepper('det', () => piano.detune, (v) => { piano.detune = v; }, 5);

  const panel = $('tune');
  const toggle = (open) => { panel.hidden = !open; $('tune-btn').setAttribute('aria-expanded', open); };
  $('tune-btn').onclick = () => toggle(panel.hidden);
  $('tune-close').onclick = () => toggle(false);
</script>
</body>
</html>
